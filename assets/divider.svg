<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 30" width="100%">
<defs><linearGradient id="d" x1="0" x2="1"><stop offset="0" stop-color="#00ff9c" stop-opacity="0"/><stop offset=".5" stop-color="#00e5ff"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<line x1="0" y1="15" x2="1200" y2="15" stroke="url(#d)" stroke-width="2"/>
<circle r="5" cy="15" fill="#fff" filter="url(#g)"><animate attributeName="cx" values="0;1200" dur="3s" repeatCount="indefinite"/></circle>
<circle r="4" cy="15" fill="#ff2bd6" filter="url(#g)"><animate attributeName="cx" values="1200;0" dur="4.5s" repeatCount="indefinite"/></circle>
</svg>