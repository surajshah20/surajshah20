<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200"><style>text{font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.glow{animation:gl 5s ease-in-out infinite}@keyframes gl{0%,100%{opacity:.55}50%{opacity:.95}}</style>
<defs><linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<radialGradient id="o" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#6366f1" stop-opacity=".4"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient></defs>
<rect x="1" y="1" width="1198" height="198" rx="22" fill="#0b1020" stroke="url(#a)" stroke-width="2"/>
<ellipse class="glow" cx="600" cy="100" rx="520" ry="120" fill="url(#o)"/>
<text x="600" y="86" text-anchor="middle" font-size="34" fill="#f1f5ff" style="font-weight:800;letter-spacing:-.5px">Let's build something great together.</text>
