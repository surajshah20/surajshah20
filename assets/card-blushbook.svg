<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 276" width="560" height="276">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0d24"/><stop offset="1" stop-color="#050510"/></linearGradient>
 <filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
 text{font-family:'Courier New',ui-monospace,Menlo,monospace}
 .bd{stroke-dasharray:90 1200;animation:run 5s linear infinite}
 @keyframes run{to{stroke-dashoffset:-1290}}
 .dot{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.2}}
 .ttl{font-family:'Segoe UI',Arial Black,Impact,sans-serif;font-weight:900;font-size:30px;letter-spacing:3px}
 .sc{animation:s 4s linear infinite}@keyframes s{from{transform:translateY(0)}to{transform:translateY(276px)}}
</style>
<clipPath id="cl"><rect x="2" y="2" width="556" height="272" rx="16"/></clipPath>
<rect x="2" y="2" width="556" height="272" rx="16" fill="url(#bg)" stroke="#ff2bd6" stroke-opacity=".25"/>
<g clip-path="url(#cl)"><rect class="sc" width="560" height="2" fill="#ff2bd6" opacity=".18"/></g>
<rect class="bd" x="2" y="2" width="556" height="272" rx="16" fill="none" stroke="#ff2bd6" stroke-width="3" filter="url(#gl)"/>
<circle class="dot" cx="32" cy="34" r="5" fill="#ff2bd6"/>
<text x="46" y="39" font-size="13" fill="#ff2bd6" letter-spacing="2">LIVE · 30+ PRINT ORDERS</text>
<text class="ttl" x="30" y="82" fill="#fff" filter="url(#gl)">BLUSHBOOK</text>
<text x="30" y="104" font-size="14" fill="#8e8eb5">Web-to-print photobook SaaS</text>
<text x="30" y="128" font-size="14" fill="#cfd0ff"><tspan fill="#ff2bd6">▸ </tspan>Konva.js canvas editor</text><text x="30" y="152" font-size="14" fill="#cfd0ff"><tspan fill="#ff2bd6">▸ </tspan>300 DPI PDF pipeline (jsPDF)</text><text x="30" y="176" font-size="14" fill="#cfd0ff"><tspan fill="#ff2bd6">▸ </tspan>Zustand undo/redo + drafts</text><text x="30" y="200" font-size="14" fill="#cfd0ff"><tspan fill="#ff2bd6">▸ </tspan>Cold start 15s → instant</text>
<line x1="30" y1="232" x2="530" y2="232" stroke="#ff2bd6" stroke-opacity=".25" stroke-dasharray="3 6"/>
<text x="30" y="258" font-size="13" fill="#ff2bd6">React · Node · PostgreSQL · Cloudinary</text>
</svg>